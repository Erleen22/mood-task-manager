<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Mood Task Manager</h1>

  <div class="mood-section">
    <p>How are you feeling today?</p>
    <button onclick="setMood('low')">😔 Low Energy</button>
    <button onclick="setMood('medium')">🙂 Okay</button>
    <button onclick="setMood('high')">😄 High Energy</button>
  </div>

  <div class="task-input">
    <input type="text" id="taskText" placeholder="Enter a task">
    <select id="taskDifficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button onclick="addTask()">Add Task</button>
  </div>

  <ul id="taskList"></ul>

  <script src="script.js"></script>
</body>
</html>
